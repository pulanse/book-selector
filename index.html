<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>选书助手 - 书单汇总</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f0f1f6;
      color: #333;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== 加载遮罩动画 ===== */
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingOverlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #f0f1f6; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #loadingOverlay .spinner {
      width: 44px; height: 44px;
      border: 4px solid #e5e5ea; border-top-color: #667eea;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    #loadingOverlay .loading-text { font-size: 14px; color: #888; }

    /* ===== 顶部 Header ===== */
    .home-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 44px 20px 64px;
      color: #fff;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .home-header::after {
      content: '';
      position: absolute; left: 0; right: 0; bottom: -30px;
      height: 60px; border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      background: #f0f1f6;
    }
    .home-header .logo { font-size: 42px; margin-bottom: 10px; }
    .home-header h1 { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
    .home-header .sub { font-size: 13px; opacity: .85; margin-top: 8px; }

    /* ===== 主体 ===== */
    .home-main {
      max-width: 860px;
      margin: -28px auto 60px;
      padding: 0 16px;
      position: relative;
      z-index: 1;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(102, 126, 234, .08);
      padding: 20px;
      margin-bottom: 18px;
    }
    .card h2 {
      font-size: 16px; color: #444; margin-bottom: 14px;
      display: flex; align-items: center; gap: 6px;
    }
    .card h2 .count-hint { font-size: 12px; color: #aaa; font-weight: 400; margin-left: auto; }

    /* 总览卡片 */
    .total-card {
      text-align: center;
      padding: 26px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      box-shadow: 0 6px 20px rgba(102, 126, 234, .25);
    }
    .total-card .total-num { font-size: 44px; font-weight: 800; line-height: 1.2; }
    .total-card .total-num span { font-size: 20px; font-weight: 500; margin-left: 6px; opacity: .9; }
    .total-card .total-sub { font-size: 13px; opacity: .85; margin-top: 8px; }
    .total-card .total-sub .version-badge {
      background: rgba(255,255,255,.2); border-radius: 10px;
      padding: 2px 10px; font-size: 12px; margin-left: 6px;
    }

    /* 类型网格 */
    .type-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .type-card {
      display: block; text-decoration: none;
      background: #f7f8fc; border: 1px solid #eef0f7;
      border-radius: 12px; padding: 14px 12px;
      transition: all .15s;
    }
    .type-card:hover { background: #eef2ff; border-color: #667eea; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,.15); }
    .type-card .tc-emoji { font-size: 22px; }
    .type-card .tc-name { font-size: 14px; font-weight: 600; color: #333; margin: 6px 0 2px; }
    .type-card .tc-num { font-size: 18px; font-weight: 700; color: #667eea; }
    .type-card .tc-bar { height: 4px; background: #e8eaf3; border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .type-card .tc-bar i { display: block; height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 2px; }
    .type-card.all { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: #fff; }
    .type-card.all .tc-name, .type-card.all .tc-num { color: #fff; }
    .type-card.all .tc-bar { background: rgba(255,255,255,.25); }
    .type-card.all .tc-bar i { background: #fff; }

    /* 中图法网格 */
    .clc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .clc-card {
      display: flex; align-items: center; gap: 10px; min-width: 0;
      background: #f7f8fc; border: 1px solid #eef0f7;
      border-radius: 12px; padding: 12px;
      text-decoration: none; transition: all .15s;
    }
    .clc-card:hover { background: #eef2ff; border-color: #667eea; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,.15); }
    .clc-card .cc-letter {
      width: 36px; height: 36px; flex-shrink: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700;
    }
    .clc-card .cc-info { min-width: 0; flex: 1; }
    .clc-card .cc-name { font-size: 13px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .clc-card .cc-num { font-size: 14px; font-weight: 700; color: #667eea; margin-top: 2px; }

    /* 进入选书按钮 */
    .enter-btn {
      display: block; text-align: center; text-decoration: none;
      background: #fff; color: #667eea;
      border: 2px solid #667eea; border-radius: 12px;
      padding: 14px; font-size: 16px; font-weight: 600;
      transition: all .15s;
    }
    .enter-btn:hover { background: #667eea; color: #fff; }

    /* ===== 响应式 ===== */
    @media (max-width: 520px) {
      .home-header { padding: 34px 16px 56px; }
      .home-header h1 { font-size: 22px; }
      .total-card .total-num { font-size: 36px; }
      .type-grid, .clc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>

  <!-- 加载遮罩 -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">📚 书单数据加载中，请稍候…</div>
  </div>

  <!-- Header -->
  <header class="home-header">
    <div class="logo">📚</div>
    <h1>选书助手</h1>
    <div class="sub">书单汇总 · 点击类型或分类进入选书</div>
  </header>

  <main class="home-main">
    <!-- 总览 -->
    <section class="card total-card">
      <div class="total-num"><span id="totalBooks">0</span> 本</div>
      <div class="total-sub">全部在库图书<span class="version-badge" id="versionBadge">书单加载中</span></div>
    </section>

    <!-- 书籍类型 -->
    <section class="card">
      <h2>📂 书籍类型<span class="count-hint" id="typeCountHint"></span></h2>
      <div class="type-grid" id="typeGrid"></div>
    </section>

    <!-- ISBN分类（中图法） -->
    <section class="card">
      <h2>🏷️ ISBN分类（中图法）<span class="count-hint" id="clcCountHint"></span></h2>
      <div class="clc-grid" id="clcGrid"></div>
    </section>

    <a class="enter-btn" href="list.html">进入选书页 →</a>
  </main>

  <!--
    ⚠️ 更新书单数据时：把 DATA_CACHE 版本号改一下（如 20260819），
    并把新的 book-data.js 上传到 GitHub 仓库，网址本身不会变。 -->
  <script>
    (function () {
      window.__DATA_CACHE = '20260819'; // 数据缓存版本号，更新书单数据时同步修改
      var isOnline = (location.protocol === 'http:' || location.protocol === 'https:');
      var urls = [];
      if (isOnline) {
        urls.push('https://cdn.jsdelivr.net/gh/pulanse/book-selector@main/book-data.js?v=' + window.__DATA_CACHE);
        urls.push('https://gcore.jsdelivr.net/gh/pulanse/book-selector@main/book-data.js?v=' + window.__DATA_CACHE);
        urls.push('https://fastly.jsdelivr.net/gh/pulanse/book-selector@main/book-data.js?v=' + window.__DATA_CACHE);
      }
      urls.push('book-data.js'); // 本地打开 / 在线兜底
      window.__dataReady = new Promise(function (resolve, reject) {
        var i = 0;
        (function loadNext() {
          if (i >= urls.length) { reject(new Error('书单数据加载失败，请刷新重试')); return; }
          var s = document.createElement('script');
          s.src = urls[i++];
          s.onload = function () { resolve(); };
          s.onerror = function () { s.remove(); loadNext(); };
          document.head.appendChild(s);
        })();
      });
    })();
  </script>

  <script>
    // ===== 主页逻辑：数据加载完成后渲染汇总 =====
    function appHome() {
      const bookData = window.BOOK_DATA || [];
      const CLC_NAMES = window.CLC_NAMES || {};
      const TYPE_EMOJI = { '幼儿': '👶', '小学': '🎒', '中学': '📖', '成人': '📚', '教师用书': '👩‍🏫', '其他': '📦' };

      // 版本徽章
      const ver = window.BOOK_VERSION || '';
      const badge = document.getElementById('versionBadge');
      if (badge) badge.textContent = ver ? '书单 ' + ver : '';

      // 1. 总本数
      let totalAll = 0;
      bookData.forEach(cat => { totalAll += cat.books.length; });
      document.getElementById('totalBooks').textContent = totalAll.toLocaleString();

      // 2. 类型卡片
      const typeGrid = document.getElementById('typeGrid');
      typeGrid.innerHTML = '';
      // "全部"入口
      const allCard = document.createElement('a');
      allCard.className = 'type-card all';
      allCard.href = 'list.html?cat=all';
      allCard.innerHTML = '<div class="tc-emoji">🗂️</div><div class="tc-name">全部图书</div><div class="tc-num">' + totalAll.toLocaleString() + '</div><div class="tc-bar"><i style="width:100%"></i></div>';
      typeGrid.appendChild(allCard);
      // 各类型
      bookData.forEach((cat, idx) => {
        const n = cat.books.length;
        const pct = totalAll ? Math.round(n / totalAll * 100) : 0;
        const card = document.createElement('a');
        card.className = 'type-card';
        card.href = 'list.html?cat=' + idx;
        card.innerHTML = '<div class="tc-emoji">' + (TYPE_EMOJI[cat.category] || '📦') + '</div><div class="tc-name">' + cat.category + '</div><div class="tc-num">' + n.toLocaleString() + '</div><div class="tc-bar"><i style="width:' + pct + '%"></i></div>';
        typeGrid.appendChild(card);
      });
      document.getElementById('typeCountHint').textContent = bookData.length + ' 类';

      // 3. 中图法分类卡片
      const clcMap = {};
      bookData.forEach(cat => {
        cat.books.forEach(b => {
          const k = b.clcLetter || '其他';
          clcMap[k] = (clcMap[k] || 0) + 1;
        });
      });
      const clcGrid = document.getElementById('clcGrid');
      clcGrid.innerHTML = '';
      Object.keys(clcMap).sort((a, b) => {
        if (a === '其他') return 1;
        if (b === '其他') return -1;
        return a.localeCompare(b);
      }).forEach(letter => {
        const name = (CLC_NAMES[letter] || '').replace(/^[A-Z]\.\s*/, '') || '其他';
        const n = clcMap[letter];
        const card = document.createElement('a');
        card.className = 'clc-card';
        card.href = 'list.html?clc=' + encodeURIComponent(letter);
        card.innerHTML = '<div class="cc-letter">' + letter + '</div><div class="cc-info"><div class="cc-name">' + name + '</div><div class="cc-num">' + n.toLocaleString() + ' 本</div></div>';
        clcGrid.appendChild(card);
      });
      document.getElementById('clcCountHint').textContent = Object.keys(clcMap).length + ' 类';

      // 隐藏加载遮罩
      const lo = document.getElementById('loadingOverlay');
      if (lo) lo.style.display = 'none';
    }

    // ===== 启动 =====
    window.__dataReady.then(function () {
      appHome();
    }).catch(function (err) {
      var lo = document.getElementById('loadingOverlay');
      if (lo) {
        lo.innerHTML = '<div style="font-size:14px;color:#888;text-align:center;line-height:1.8;">⚠️ 书单数据加载失败<br><span style="font-size:12px;">请检查网络后刷新重试</span></div>';
      }
      console.error(err);
    });
  </script>
</body>
</html>
